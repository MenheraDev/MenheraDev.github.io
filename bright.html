<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>点灯時刻</title>
    <style>
        @font-face {
            font-family: "Bender";
            src: url("./src/font/Bender.otf");
        }
        /* ズーム・スクロール・選択・長押しメニューの抑止 */
        html {
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        * {
            touch-action: none; /* ダブルタップ/ピンチ/パンをブラウザ側で無効化 */
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            background-color: #1a1d1f; /* グレーの背景 */
            font-family: "Bender", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed; /* iOS Safari のバウンススクロール対策 */
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh; /* アドレスバーを考慮した高さ(非対応ブラウザは上の100vh) */
            overflow: hidden;
            overscroll-behavior: none;
            color: white;
        }
        .container {
            width: 350px; /* 横幅固定 */
            padding: 20px;
            background-color: #2c3133;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: left;
            overflow: hidden; /* 文字のスライド時にはみ出た部分を隠す */
        }
        .banner {
            display: flex;
            height: 30px;
            margin-bottom: 15px;
        }
        .banner div {
            flex: 1;
        }
        .banner div:nth-child(1) { background-color: #ED7D95; }
        .banner div:nth-child(2) { background-color: #E7D600; }
        .banner div:nth-child(3) { background-color: #D81C2F; }
        .banner div:nth-child(4) { background-color: #FF5800; }
        .banner div:nth-child(5) { background-color: #84C36E; }
        .banner div:nth-child(6) { background-color: #9CA5B9; }
        .banner div:nth-child(7) { background-color: #A664A0; }
        .banner div:nth-child(8) { background-color: #01B7ED; }
        .banner div:nth-child(9) { background-color: #485EC6; }
        .banner div:nth-child(10) { background-color: #F8C8C4; }
        .banner div:nth-child(11) { background-color: #37B484; }
        .banner div:nth-child(12) { background-color: #A99E98; }
        .time {
            font-size: 36px; /* 基本の時刻サイズ */
            margin-bottom: 5px;
        }
        /* 3分18秒前・2分25秒前を過ぎた場合の色（ほんの少し薄いピンク） */
        .time.passed {
            color: #FFC4CC;
        }
        /* 日没時刻を手動で調整した場合の色（薄い緑） */
        .time.adjusted {
            color: #B9F0B4;
        }
        .milliseconds {
            font-size: 30px; /* ミリ秒サイズ */
        }
        .description {
            font-size: 16px;
            margin-bottom: 5px;
        }
        /* 日没時刻周辺のスワイプ領域（見た目は変えず、タッチ判定のみ上下左右に広げる） */
        .sunset-zone {
            margin: -6px -20px;
            padding: 6px 20px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 5px; /* current-dateとの余白 */
        }
        #current-date {
            margin: 0 5px;
        }
        .button {
            background-color: #ddd;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.1s ease-in-out;
        }
        .button:hover {
            background-color: #ccc;
        }
        .error {
            color: #FF5800;
            font-size: 14px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="banner">
            <div></div><div></div><div></div><div></div><div></div>
            <div></div><div></div><div></div><div></div><div></div>
            <div></div><div></div>
        </div>
        <div class="description">現在時刻:</div>
        <div class="time" id="current-time"></div>
        <div class="sunset-zone" id="sunset-zone">
            <div class="description">日没時刻:</div>
            <div class="time" id="sunset-time"></div>
        </div>
        <div class="description">日没後30分:</div>
        <div class="time" id="sunset-plus30"></div>
        <div class="description">3分18秒前:</div>
        <div class="time" id="minus318"></div>
        <div class="description">2分25秒前:</div>
        <div class="time" id="minus225"></div>
        <div class="controls">
            <button class="button" id="prev-day">前の日</button>
            <div id="current-date"></div>
            <button class="button" id="next-day">次の日</button>
        </div>
        <div class="error" id="error-msg"></div>
    </div>

    <!-- SunCalc: 国立天文台と同等精度の天文計算ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"></script>

    <script>
        const lat = 35.6581; // 緯度
        const lon = 139.7414; // 経度
        const tz = 'Asia/Tokyo';
        let currentDate = new Date();
        let sunsetTime = null; // Date オブジェクトで日没時刻を保持
        let sunsetOffsetMin = 0; // 日没時刻の手動調整量（分）。日付移動時は 0 に戻す
        let busy = false; // アニメーション中の多重操作防止

        const SLIDE_MS = 130; // スライドアニメーション片道の時間(ms)
        const SLIDE_PX = 40; // スライド距離(px)
        const SWIPE_MIN_PX = 40; // スワイプとみなす最小横移動量(px)
        const SWIPE_RATIO = 1.5; // 横移動が縦移動の何倍以上ならスワイプとみなすか

        function formatMilliseconds(ms) {
            const firstDigit = Math.floor(ms / 100); // 上位1桁
            return `${firstDigit}0`; // 2桁目を0に固定
        }

        function showError(msg) {
            document.getElementById('error-msg').textContent = msg;
        }

        function clearError() {
            document.getElementById('error-msg').textContent = '';
        }

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        /**
         * SunCalc を使用して日没時刻を計算する。
         * SunCalc は IERS 標準の天文計算に基づき、
         * 国立天文台の日の入り時刻と概ね1分以内の誤差で一致する。
         */
        function calculateSunset() {
            clearError();

            // SunCalc が読み込めているか確認
            if (typeof SunCalc === 'undefined') {
                showError('エラー: SunCalc の読み込みに失敗しました。ネットワーク接続を確認してください。');
                sunsetTime = null;
                updateDisplay();
                return;
            }

            try {
                // currentDate の年月日を Asia/Tokyo 基準で取得し、
                // その日の正午(JST)を基点として SunCalc に渡す
                // （日付ズレを防ぐため、UTC 変換ではなく JST の年月日を明示的に使用する）
                const jstOffset = 9 * 60; // JST は UTC+9
                const localMidnight = new Date(currentDate);
                // currentDate の JST での年月日を取得
                const jstDateStr = currentDate.toLocaleDateString('ja-JP', {
                    timeZone: tz,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit'
                });
                // "2026/05/13" 形式を "2026-05-13" に変換して Date 生成
                const normalized = jstDateStr.replace(/\//g, '-');
                // JST 正午を UTC として構築（SunCalc はその日の太陽位置を正確に計算）
                const [y, m, d] = normalized.split('-').map(Number);
                const refDate = new Date(Date.UTC(y, m - 1, d, 12 - 9, 0, 0)); // JST12:00 = UTC03:00

                const times = SunCalc.getTimes(refDate, lat, lon);

                if (!times.sunset || isNaN(times.sunset.getTime())) {
                    showError('エラー: 日没時刻の計算に失敗しました。');
                    sunsetTime = null;
                    updateDisplay();
                    return;
                }

                sunsetTime = times.sunset;
                updateDisplay();

            } catch (e) {
                showError('エラー: 日没時刻の計算中に例外が発生しました。(' + e.message + ')');
                sunsetTime = null;
                updateDisplay();
            }
        }

        /**
         * 手動調整を反映した「実効の日没時刻」を返す。
         * 調整量が 0 の場合は SunCalc の計算値（秒あり）をそのまま使う。
         * 調整量が 0 以外の場合は、計算値を分単位に切り捨ててから調整量(分)を加え、秒を 00 にする。
         */
        function getEffectiveSunset() {
            if (!sunsetTime) {
                return null;
            }
            if (sunsetOffsetMin === 0) {
                return { date: sunsetTime, adjusted: false };
            }
            const baseMinute = Math.floor(sunsetTime.getTime() / 60000) * 60000;
            return { date: new Date(baseMinute + sunsetOffsetMin * 60000), adjusted: true };
        }

        function updateDisplay() {
            try {
                const options = { timeZone: tz, hour12: false, year: 'numeric', month: '2-digit', day: '2-digit' };
                document.getElementById('current-date').textContent = currentDate.toLocaleDateString('ja-JP', options);

                const now = new Date();
                const formattedTime = now.toLocaleTimeString('ja-JP', { timeZone: tz, hour12: false });
                const milliseconds = formatMilliseconds(now.getMilliseconds());
                document.getElementById('current-time').innerHTML = `${formattedTime}.<span class="milliseconds">${milliseconds}</span>`;

                const sunsetEl = document.getElementById('sunset-time');
                const plus30El = document.getElementById('sunset-plus30');
                const minus318El = document.getElementById('minus318');
                const minus225El = document.getElementById('minus225');

                const effective = getEffectiveSunset();

                if (effective) {
                    // 日没時刻（調整済みの場合は秒が 00 で薄い緑）
                    const sunsetStr = effective.date.toLocaleTimeString('ja-JP', { timeZone: tz, hour12: false });
                    sunsetEl.innerHTML = `${sunsetStr}.<span class="milliseconds">00</span>`;
                    sunsetEl.classList.toggle('adjusted', effective.adjusted);

                    // 日没後30分（秒は切り捨て）
                    const plus30Ms = Math.floor((effective.date.getTime() + 30 * 60 * 1000) / 60000) * 60000;
                    const sunsetPlus30 = new Date(plus30Ms);
                    const sunsetPlus30Str = sunsetPlus30.toLocaleTimeString('ja-JP', { timeZone: tz, hour12: false });
                    plus30El.innerHTML = `${sunsetPlus30Str}.<span class="milliseconds">00</span>`;

                    // 日没後30分の3分18秒前
                    const minus318 = new Date(sunsetPlus30.getTime() - (3 * 60 + 18) * 1000);
                    minus318El.innerHTML = `${minus318.toLocaleTimeString('ja-JP', { timeZone: tz, hour12: false })}.<span class="milliseconds">00</span>`;

                    // 日没後30分の2分25秒前
                    const minus225 = new Date(sunsetPlus30.getTime() - (2 * 60 + 25) * 1000);
                    minus225El.innerHTML = `${minus225.toLocaleTimeString('ja-JP', { timeZone: tz, hour12: false })}.<span class="milliseconds">00</span>`;

                    // 現在の日時が各時刻（日付を含む）を過ぎたら薄いピンクにする
                    minus318El.classList.toggle('passed', now.getTime() >= minus318.getTime());
                    minus225El.classList.toggle('passed', now.getTime() >= minus225.getTime());

                } else {
                    // 日没時刻が取得できていない場合は「--:--:--」を表示
                    const placeholder = '--:--:--.<span class="milliseconds">--</span>';
                    sunsetEl.innerHTML = placeholder;
                    plus30El.innerHTML = placeholder;
                    minus318El.innerHTML = placeholder;
                    minus225El.innerHTML = placeholder;
                    sunsetEl.classList.remove('adjusted');
                    minus318El.classList.remove('passed');
                    minus225El.classList.remove('passed');
                }
            } catch (e) {
                showError('エラー: 表示の更新中に例外が発生しました。(' + e.message + ')');
            }
        }

        /**
         * 文字だけを横にスライドさせて値を入れ替える。
         * dir: +1 = 次へ（文字は左へ退出し、右から入場）/ -1 = 前へ（文字は右へ退出し、左から入場）
         * updateFn: 退出アニメーション終了後に実行する値の更新処理
         * Web Animations API が使えない環境ではアニメーションなしで値だけ更新する。
         */
        async function slideTransition(els, dir, updateFn) {
            const canAnimate = els.length > 0 && els.every(el => el && typeof el.animate === 'function');
            if (!canAnimate) {
                updateFn();
                return;
            }

            // 退出
            const outAnims = els.map(el => el.animate(
                [
                    { transform: 'translateX(0)', opacity: 1 },
                    { transform: `translateX(${-dir * SLIDE_PX}px)`, opacity: 0 }
                ],
                { duration: SLIDE_MS, easing: 'ease-in', fill: 'forwards' }
            ));
            await wait(SLIDE_MS);

            // 値の更新（失敗しても退出アニメーションの固着が残らないよう finally で解除）
            try {
                updateFn();
            } finally {
                outAnims.forEach(a => {
                    try { a.cancel(); } catch (_) { /* 無視 */ }
                });
            }

            // 入場（開始位置を fill: backwards で先に適用しチラつきを防ぐ）
            els.forEach(el => el.animate(
                [
                    { transform: `translateX(${dir * SLIDE_PX}px)`, opacity: 0 },
                    { transform: 'translateX(0)', opacity: 1 }
                ],
                { duration: SLIDE_MS, easing: 'ease-out', fill: 'backwards' }
            ));
            await wait(SLIDE_MS);
        }

        /**
         * 日付を前後に移動する（画面全体のスワイプ／ボタン共通）。
         * dir: +1 = 次の日 / -1 = 前の日
         */
        async function shiftDay(dir) {
            if (busy) {
                return;
            }
            busy = true;
            try {
                const targets = [
                    document.getElementById('current-date'),
                    document.getElementById('sunset-time'),
                    document.getElementById('sunset-plus30'),
                    document.getElementById('minus318'),
                    document.getElementById('minus225')
                ];
                await slideTransition(targets, dir, () => {
                    currentDate.setDate(currentDate.getDate() + dir);
                    sunsetOffsetMin = 0; // 別の日の日没には手動調整を引き継がない
                    calculateSunset();
                });
            } catch (e) {
                showError('エラー: 日付の切り替え中に例外が発生しました。(' + e.message + ')');
            } finally {
                busy = false;
            }
        }

        /**
         * 日没時刻を前後に1分ずらす（日付は変えない）。
         * dir: +1 = 1分後 / -1 = 1分前
         */
        async function shiftSunset(dir) {
            if (busy) {
                return;
            }
            if (!sunsetTime) {
                showError('エラー: 日没時刻が取得できていないため、調整できません。');
                return;
            }
            busy = true;
            try {
                clearError();
                await slideTransition([document.getElementById('sunset-time')], dir, () => {
                    sunsetOffsetMin += dir;
                    updateDisplay();
                });
            } catch (e) {
                showError('エラー: 日没時刻の調整中に例外が発生しました。(' + e.message + ')');
            } finally {
                busy = false;
            }
        }

        // ボタン操作
        document.getElementById('prev-day').addEventListener('click', () => { shiftDay(-1); });
        document.getElementById('next-day').addEventListener('click', () => { shiftDay(1); });

        // ---- スワイプ検出（Pointer Events：iOS Safari 13+ / Firefox 対応） ----
        let gestureValid = false;
        let startX = 0;
        let startY = 0;
        let startInSunsetZone = false;
        let startOnButton = false;

        document.addEventListener('pointerdown', (e) => {
            try {
                if (!e.isPrimary) {
                    gestureValid = false; // 2本目以降の指はスワイプ扱いにしない
                    return;
                }
                const target = e.target;
                gestureValid = true;
                startX = e.clientX;
                startY = e.clientY;
                startInSunsetZone = !!(target && target.closest && target.closest('#sunset-zone'));
                startOnButton = !!(target && target.closest && target.closest('button'));
            } catch (err) {
                gestureValid = false;
                showError('エラー: タッチ開始の処理中に例外が発生しました。(' + err.message + ')');
            }
        });

        document.addEventListener('pointerup', (e) => {
            try {
                if (!gestureValid || !e.isPrimary) {
                    return;
                }
                gestureValid = false;
                if (startOnButton) {
                    return; // ボタン上の操作はクリックに任せる
                }
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                if (Math.abs(dx) < SWIPE_MIN_PX || Math.abs(dx) < Math.abs(dy) * SWIPE_RATIO) {
                    return; // 移動量不足、または縦方向が優勢
                }
                const dir = dx < 0 ? 1 : -1; // 左スワイプ = 次へ(+1)、右スワイプ = 前へ(-1)
                if (startInSunsetZone) {
                    shiftSunset(dir);
                } else {
                    shiftDay(dir);
                }
            } catch (err) {
                showError('エラー: スワイプの処理中に例外が発生しました。(' + err.message + ')');
            }
        });

        document.addEventListener('pointercancel', () => {
            gestureValid = false;
        });

        // ---- ズーム・スクロールの厳密な禁止 ----
        // iOS Safari: ピンチ（gesture イベント）
        ['gesturestart', 'gesturechange', 'gestureend'].forEach((name) => {
            document.addEventListener(name, (e) => { e.preventDefault(); }, { passive: false });
        });

        // スクロール・パンの禁止（iOS Safari / Firefox）
        document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });

        // 2本指以上のタッチ（ピンチ）の禁止
        document.addEventListener('touchstart', (e) => {
            if (e.touches && e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });

        // ダブルタップズームの禁止（350ms 以内の2回目のタップを無効化）
        // 2回目の click も無効化されてしまうため、ボタン上の場合は手動で click を実行する
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const nowMs = Date.now();
            if (nowMs - lastTouchEnd <= 350) {
                e.preventDefault();
                const btn = e.target && e.target.closest ? e.target.closest('button') : null;
                if (btn) {
                    btn.click();
                }
            }
            lastTouchEnd = nowMs;
        }, { passive: false });

        document.addEventListener('dblclick', (e) => { e.preventDefault(); }, { passive: false });

        // PC 版 Firefox 等: Ctrl+ホイール／キーボードによるズームとスクロールの禁止
        document.addEventListener('wheel', (e) => { e.preventDefault(); }, { passive: false });
        document.addEventListener('keydown', (e) => {
            const zoomKeys = ['+', '-', '=', '0', '_'];
            if ((e.ctrlKey || e.metaKey) && zoomKeys.includes(e.key)) {
                e.preventDefault();
                return;
            }
            const scrollKeys = [' ', 'PageUp', 'PageDown', 'Home', 'End', 'ArrowUp', 'ArrowDown'];
            if (scrollKeys.includes(e.key)) {
                e.preventDefault();
            }
        });

        // 初回計算
        calculateSunset();

        // 0.1秒ごとに現在時刻を更新（日没時刻の再計算は不要）
        setInterval(updateDisplay, 100);
    </script>
</body>
</html>
