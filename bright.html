<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>点灯時刻</title>
    <style>
        @font-face {
            font-family: "Bender";
            src: url("./src/font/Bender.otf");
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;                 /* スクロール禁止 */
            overscroll-behavior: none;        /* ゴムバンド/引っ張り更新の禁止 */
            touch-action: none;               /* ブラウザ標準のパン・ピンチ・ダブルタップを禁止 */
            -webkit-text-size-adjust: 100%;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            position: fixed;                  /* 画面に固定してスクロール余地を無くす */
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #1a1d1f; /* グレーの背景 */
            font-family: "Bender", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .container {
            width: 350px; /* 横幅固定 */
            padding: 20px;
            background-color: #2c3133;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: left;
            will-change: transform, opacity;
        }
        .banner {
            display: flex;
            height: 30px;
            margin-bottom: 15px;
        }
        .banner div {
            flex: 1;
        }
        .banner div:nth-child(1) { background-color: #ED7D95; }
        .banner div:nth-child(2) { background-color: #E7D600; }
        .banner div:nth-child(3) { background-color: #D81C2F; }
        .banner div:nth-child(4) { background-color: #FF5800; }
        .banner div:nth-child(5) { background-color: #84C36E; }
        .banner div:nth-child(6) { background-color: #9CA5B9; }
        .banner div:nth-child(7) { background-color: #A664A0; }
        .banner div:nth-child(8) { background-color: #01B7ED; }
        .banner div:nth-child(9) { background-color: #485EC6; }
        .banner div:nth-child(10) { background-color: #F8C8C4; }
        .banner div:nth-child(11) { background-color: #37B484; }
        .banner div:nth-child(12) { background-color: #A99E98; }
        .now-area {
            overflow: hidden; /* 1分ずらしのスライド時にはみ出た部分を隠す */
        }
        .now-inner {
            will-change: transform, opacity;
        }
        .time {
            font-size: 36px; /* 基本の時刻サイズ */
            margin-bottom: 5px;
            transition: color 0.3s ease;
        }
        .milliseconds {
            font-size: 30px; /* ミリ秒サイズ */
        }
        .description {
            font-size: 16px;
            margin-bottom: 5px;
            transition: color 0.3s ease;
        }
        /* 経過後の薄いピンク(赤) */
        .time.passed,
        .description.passed {
            color: #FFCDD2;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 5px; /* current-dateとの余白 */
        }
        #current-date {
            margin: 0 5px;
        }
        .button {
            background-color: #ddd;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.1s ease-in-out;
        }
        .button:hover {
            background-color: #ccc;
        }
        .error {
            color: #FF5800;
            font-size: 14px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="banner">
            <div></div><div></div><div></div><div></div><div></div>
            <div></div><div></div><div></div><div></div><div></div>
            <div></div><div></div>
        </div>
        <div class="now-area" id="now-area">
            <div class="now-inner" id="now-inner">
                <div class="description">現在時刻:</div>
                <div class="time" id="current-time"></div>
            </div>
        </div>
        <div class="description">日没時刻:</div>
        <div class="time" id="sunset-time"></div>
        <div class="description">日没後30分:</div>
        <div class="time" id="sunset-plus30"></div>
        <div class="description" id="desc-minus318">3分18秒前:</div>
        <div class="time" id="minus318"></div>
        <div class="description" id="desc-minus225">2分25秒前:</div>
        <div class="time" id="minus225"></div>
        <div class="controls">
            <button class="button" id="prev-day">前の日</button>
            <div id="current-date"></div>
            <button class="button" id="next-day">次の日</button>
        </div>
        <div class="error" id="error-msg"></div>
    </div>

    <!-- SunCalc: 国立天文台と同等精度の天文計算ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"></script>

    <script>
        const lat = 35.6581; // 緯度
        const lon = 139.7414; // 経度
        const tz = 'Asia/Tokyo';
        let currentDate = new Date();
        let sunsetTime = null; // Date オブジェクトで日没時刻を保持

        // ---- 追加: 状態 ----
        let minuteOffset = 0;        // 現在時刻に加える「分」のずらし量(日付は変えない)
        let isAnimating = false;     // スワイプ確定アニメーション中フラグ
        const SWIPE_THRESHOLD = 60;  // スワイプ確定距離(px)
        const ANIM_MS = 220;         // アニメーション時間(ms)

        function formatMilliseconds(ms) {
            const firstDigit = Math.floor(ms / 100); // 上位1桁
            return `${firstDigit}0`; // 2桁目を0に固定
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            if (el) el.textContent = msg;
        }

        function clearError() {
            const el = document.getElementById('error-msg');
            if (el) el.textContent = '';
        }

        /** 表示用の現在時刻(実時刻 + 1分単位のずらし量)を返す */
        function getNow() {
            return new Date(Date.now() + minuteOffset * 60 * 1000);
        }

        /** 経過済みの行(説明文と時刻)に薄いピンクのクラスを付け外しする */
        function setPassed(timeId, descId, passed) {
            const t = document.getElementById(timeId);
            const d = document.getElementById(descId);
            if (t) t.classList.toggle('passed', passed);
            if (d) d.classList.toggle('passed', passed);
        }

        /**
         * SunCalc を使用して日没時刻を計算する。
         * SunCalc は IERS 標準の天文計算に基づき、
         * 国立天文台の日の入り時刻と概ね1分以内の誤差で一致する。
         */
        function calculateSunset() {
            clearError();

            // SunCalc が読み込めているか確認
            if (typeof SunCalc === 'undefined') {
                showError('エラー: SunCalc の読み込みに失敗しました。ネットワーク接続を確認してください。');
                sunsetTime = null;
                updateDisplay();
                return;
            }

            try {
                // currentDate の年月日を Asia/Tokyo 基準で取得し、
                // その日の正午(JST)を基点として SunCalc に渡す
                // （日付ズレを防ぐため、UTC 変換ではなく JST の年月日を明示的に使用する）
                const jstOffset = 9 * 60; // JST は UTC+9
                const localMidnight = new Date(currentDate);
                // currentDate の JST での年月日を取得
                const jstDateStr = currentDate.toLocaleDateString('ja-JP', {
                    timeZone: tz,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit'
                });
                // "2026/05/13" 形式を "2026-05-13" に変換して Date 生成
                const normalized = jstDateStr.replace(/\//g, '-');
                // JST 正午を UTC として構築（SunCalc はその日の太陽位置を正確に計算）
                const [y, m, d] = normalized.split('-').map(Number);
                const refDate = new Date(Date.UTC(y, m - 1, d, 12 - 9, 0, 0)); // JST12:00 = UTC03:00

                const times = SunCalc.getTimes(refDate, lat, lon);

                if (!times.sunset || isNaN(times.sunset.getTime())) {
                    showError('エラー: 日没時刻の計算に失敗しました。');
                    sunsetTime = null;
                    updateDisplay();
                    return;
                }

                sunsetTime = times.sunset;
                updateDisplay();

            } catch (e) {
                showError('エラー: 日没時刻の計算中に例外が発生しました。(' + e.message + ')');
                sunsetTime = null;
                updateDisplay();
            }
        }

        function updateDisplay() {
            try {
                const options = { timeZone: tz, hour12: false, year: 'numeric', month: '2-digit', day: '2-digit' };
                document.getElementById('current-date').textContent = currentDate.toLocaleDateString('ja-JP', options);

                const now = getNow(); // 1分ずらし量を反映した現在時刻
                const formattedTime = now.toLocaleTimeString('ja-JP', { timeZone: tz, hour12: false });
                const milliseconds = formatMilliseconds(now.getMilliseconds());
                document.getElementById('current-time').innerHTML = `${formattedTime}.<span class="milliseconds">${milliseconds}</span>`;

                if (sunsetTime) {
                    // 日没時刻
                    const sunsetStr = sunsetTime.toLocaleTimeString('ja-JP', { timeZone: tz, hour12: false });
                    document.getElementById('sunset-time').innerHTML = `${sunsetStr}.<span class="milliseconds">00</span>`;

                    // 日没後30分（秒は切り捨て）
                    const sunsetPlus30 = new Date(sunsetTime.getTime() + 30 * 60 * 1000);
                    sunsetPlus30.setSeconds(0);
                    const sunsetPlus30Str = sunsetPlus30.toLocaleTimeString('ja-JP', { timeZone: tz, hour12: false });
                    document.getElementById('sunset-plus30').innerHTML = `${sunsetPlus30Str}.<span class="milliseconds">00</span>`;

                    // 日没後30分の3分18秒前
                    const minus318 = new Date(sunsetPlus30.getTime() - (3 * 60 + 18) * 1000);
                    document.getElementById('minus318').innerHTML = `${minus318.toLocaleTimeString('ja-JP', { timeZone: tz, hour12: false })}.<span class="milliseconds">00</span>`;

                    // 日没後30分の2分25秒前
                    const minus225 = new Date(sunsetPlus30.getTime() - (2 * 60 + 25) * 1000);
                    document.getElementById('minus225').innerHTML = `${minus225.toLocaleTimeString('ja-JP', { timeZone: tz, hour12: false })}.<span class="milliseconds">00</span>`;

                    // 経過判定(表示は秒までなので、比較も秒単位に揃える)
                    const nowMs = now.getTime();
                    const m318Ms = Math.floor(minus318.getTime() / 1000) * 1000;
                    const m225Ms = Math.floor(minus225.getTime() / 1000) * 1000;
                    setPassed('minus318', 'desc-minus318', nowMs >= m318Ms);
                    setPassed('minus225', 'desc-minus225', nowMs >= m225Ms);

                } else {
                    // 日没時刻が取得できていない場合は「--:--:--」を表示
                    const placeholder = '--:--:--.<span class="milliseconds">--</span>';
                    document.getElementById('sunset-time').innerHTML = placeholder;
                    document.getElementById('sunset-plus30').innerHTML = placeholder;
                    document.getElementById('minus318').innerHTML = placeholder;
                    document.getElementById('minus225').innerHTML = placeholder;
                    setPassed('minus318', 'desc-minus318', false);
                    setPassed('minus225', 'desc-minus225', false);
                }
            } catch (e) {
                showError('エラー: 表示の更新中に例外が発生しました。(' + e.message + ')');
            }
        }

        // =====================================================
        // ズーム・スクロール禁止
        // =====================================================
        function setupZoomAndScrollGuard() {
            try {
                // iOS Safari のピンチ操作(gesture イベント)を禁止
                ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (name) {
                    document.addEventListener(name, function (e) { e.preventDefault(); }, { passive: false });
                });

                // 2本指以上のタッチ開始(ピンチの起点)を禁止
                document.addEventListener('touchstart', function (e) {
                    if (e.touches && e.touches.length > 1) e.preventDefault();
                }, { passive: false });

                // タッチによるスクロール・ピンチ移動を禁止
                document.addEventListener('touchmove', function (e) {
                    e.preventDefault();
                }, { passive: false });

                // ダブルタップによるズームを禁止(ボタンのクリックは妨げない)
                let lastTouchEnd = 0;
                document.addEventListener('touchend', function (e) {
                    const now = Date.now();
                    const onButton = e.target && e.target.closest && e.target.closest('button');
                    if (now - lastTouchEnd <= 350 && !onButton) e.preventDefault();
                    lastTouchEnd = now;
                }, { passive: false });
                document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });

                // ホイールスクロール・Ctrl+ホイールのズームを禁止
                document.addEventListener('wheel', function (e) { e.preventDefault(); }, { passive: false });

                // キーボードによるズームを禁止
                document.addEventListener('keydown', function (e) {
                    if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '_', '0'].indexOf(e.key) !== -1) {
                        e.preventDefault();
                    }
                });

                // 万一スクロールされた場合は先頭へ戻す
                window.addEventListener('scroll', function () { window.scrollTo(0, 0); });
            } catch (e) {
                showError('エラー: ズーム・スクロール禁止の設定に失敗しました。(' + e.message + ')');
            }
        }

        // =====================================================
        // スワイプ処理
        //   ・画面全体: 左スワイプ=翌日 / 右スワイプ=前日
        //   ・現在時刻の周辺: 左スワイプ=+1分 / 右スワイプ=-1分(日付は変更しない)
        // =====================================================
        function setTransform(el, x, opacity) {
            el.style.transform = 'translate3d(' + x + 'px, 0, 0)';
            el.style.opacity = String(opacity);
        }

        function clearTransform(el) {
            el.style.transition = '';
            el.style.transform = '';
            el.style.opacity = '';
        }

        function springBack(el) {
            el.style.transition = 'transform ' + ANIM_MS + 'ms ease-out, opacity ' + ANIM_MS + 'ms ease-out';
            setTransform(el, 0, 1);
            setTimeout(function () { clearTransform(el); }, ANIM_MS + 20);
        }

        /**
         * スワイプ確定時のアニメーション。
         * 現在の内容を方向に沿ってスライドアウト → 値を更新 → 反対側からスライドイン。
         * dir: +1 = 左スワイプ(翌日 / +1分)、-1 = 右スワイプ(前日 / -1分)
         */
        function commitSwipe(mode, el, dir) {
            isAnimating = true;
            const width = (mode === 'day') ? window.innerWidth : el.offsetWidth;

            el.style.transition = 'transform ' + ANIM_MS + 'ms ease-in, opacity ' + ANIM_MS + 'ms ease-in';
            setTransform(el, -dir * width, 0);

            setTimeout(function () {
                try {
                    if (mode === 'day') {
                        currentDate.setDate(currentDate.getDate() + dir);
                        calculateSunset();
                    } else {
                        minuteOffset += dir;
                        updateDisplay();
                    }
                } catch (e) {
                    showError('エラー: スワイプ処理中に例外が発生しました。(' + e.message + ')');
                }

                try {
                    // 反対側へ瞬間移動してからスライドイン
                    el.style.transition = 'none';
                    setTransform(el, dir * width, 0);
                    void el.offsetWidth; // 強制リフロー(transition を確実に切り替えるため)
                    el.style.transition = 'transform ' + ANIM_MS + 'ms ease-out, opacity ' + ANIM_MS + 'ms ease-out';
                    setTransform(el, 0, 1);
                } catch (e) {
                    clearTransform(el);
                    isAnimating = false;
                    showError('エラー: アニメーション処理に失敗しました。(' + e.message + ')');
                    return;
                }

                setTimeout(function () {
                    clearTransform(el);
                    isAnimating = false;
                }, ANIM_MS + 20);
            }, ANIM_MS);
        }

        function setupSwipe() {
            const container = document.getElementById('container');
            const nowInner = document.getElementById('now-inner');
            if (!container || !nowInner) {
                showError('エラー: スワイプ対象の要素が見つかりません。');
                return;
            }

            let drag = null;                       // 進行中のドラッグ情報
            const activePointers = new Set();      // 接触中のポインタ(複数接触の検出用)
            let swipeJustHappened = false;         // スワイプ直後のクリック抑止用

            function onPointerDown(e) {
                try {
                    if (e.pointerType === 'mouse' && e.button !== 0) return;
                    activePointers.add(e.pointerId);
                    if (activePointers.size > 1) { // 複数接触はスワイプとして扱わない
                        if (drag) { springBack(drag.el); }
                        drag = null;
                        return;
                    }
                    if (isAnimating) return;

                    const inNow = e.target && e.target.closest && e.target.closest('#now-area');
                    drag = {
                        id: e.pointerId,
                        startX: e.clientX,
                        startY: e.clientY,
                        dx: 0,
                        active: false,
                        mode: inNow ? 'minute' : 'day',
                        el: inNow ? nowInner : container
                    };
                } catch (err) {
                    drag = null;
                    showError('エラー: スワイプ開始処理に失敗しました。(' + err.message + ')');
                }
            }

            function onPointerMove(e) {
                try {
                    if (!drag || e.pointerId !== drag.id) return;
                    const dx = e.clientX - drag.startX;
                    const dy = e.clientY - drag.startY;

                    if (!drag.active) {
                        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return; // 微小移動は無視
                        if (Math.abs(dy) > Math.abs(dx)) { drag = null; return; } // 縦方向は無視
                        drag.active = true;
                        drag.el.style.transition = 'none';
                    }

                    drag.dx = dx;
                    if (drag.mode === 'day') {
                        const w = window.innerWidth || 1;
                        setTransform(drag.el, dx, Math.max(0.3, 1 - Math.abs(dx) / (w * 1.2)));
                    } else {
                        const w = drag.el.offsetWidth || 1;
                        setTransform(drag.el, dx * 0.7, Math.max(0.3, 1 - Math.abs(dx) / (w * 1.2)));
                    }
                } catch (err) {
                    if (drag) clearTransform(drag.el);
                    drag = null;
                    showError('エラー: スワイプ移動処理に失敗しました。(' + err.message + ')');
                }
            }

            function onPointerEnd(e) {
                try {
                    activePointers.delete(e.pointerId);
                    if (!drag || e.pointerId !== drag.id) return;

                    const d = drag;
                    drag = null;
                    if (!d.active) return; // 単なるタップ

                    swipeJustHappened = true;
                    setTimeout(function () { swipeJustHappened = false; }, 100);

                    if (e.type === 'pointercancel' || Math.abs(d.dx) < SWIPE_THRESHOLD) {
                        springBack(d.el); // 距離不足またはキャンセル: 元に戻す
                        return;
                    }
                    commitSwipe(d.mode, d.el, d.dx < 0 ? 1 : -1);
                } catch (err) {
                    isAnimating = false;
                    showError('エラー: スワイプ終了処理に失敗しました。(' + err.message + ')');
                }
            }

            document.addEventListener('pointerdown', onPointerDown);
            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerup', onPointerEnd);
            document.addEventListener('pointercancel', onPointerEnd);

            // ボタン上でスワイプした場合に、直後のクリックでボタンが誤作動しないようにする
            document.addEventListener('click', function (e) {
                if (swipeJustHappened) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }, true);
        }

        document.getElementById('prev-day').addEventListener('click', () => {
            currentDate.setDate(currentDate.getDate() - 1);
            calculateSunset();
        });

        document.getElementById('next-day').addEventListener('click', () => {
            currentDate.setDate(currentDate.getDate() + 1);
            calculateSunset();
        });

        // 初期化
        setupZoomAndScrollGuard();
        setupSwipe();

        // 初回計算
        calculateSunset();

        // 0.1秒ごとに現在時刻を更新（日没時刻の再計算は不要）
        setInterval(updateDisplay, 100);
    </script>
</body>
</html>
